name: gitleaks

# Gitleaks: scans the repo's git history for accidentally-committed
# secrets — private keys, API tokens, anything matching the canonical
# rule set.
#
# Critical for a crypto SDK: a single committed `0x...` private key
# would compromise every wallet that ever signed with it.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '37 4 * * 1' # Mondays at 04:37 UTC (weekly diff)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license key set → uses the OSS edition. Fine for a public repo.
          GITLEAKS_ENABLE_COMMENTS: 'true'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'
