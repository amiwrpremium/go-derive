name: gosec

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gosec:
    name: gosec security scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Run Gosec
        # gosec releases work like this: maintainers tag e.g. v2.26.1, then push a
        # follow-up commit on master that bumps the action's bundled gosec binary
        # to that version. Pinning to the post-release master commit is therefore
        # *newer* than pinning to the tag itself; pinning to the tag would run an
        # older gosec. Renovate should keep this on the latest such post-release SHA.
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0+1 (master)
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif -exclude-dir=examples -exclude-dir=test ./...'
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@0daab03d71ff584ef619d027a3fd9146679c5d84 # v3
        if: always()
        with:
          sarif_file: gosec.sarif
