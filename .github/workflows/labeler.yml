name: labeler

# Apply path-based labels (`area:auth`, `area:rest`, …) to every PR.
# The mapping lives in `.github/labeler.yml`; the label palette is
# declared in `.github/settings.yml`. Runs on `pull_request_target`
# so it can label PRs from forks (the workflow file from base, not
# the PR head, runs — never executes untrusted PR code).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: apply labels
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          dot: true
