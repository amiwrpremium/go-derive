name: labeler

# Apply path-based labels (`area:auth`, `area:rest`, …) to every PR.
# The mapping lives in `.github/labeler.yml`; the label palette is
# declared in `.github/settings.yml`. Runs on `pull_request_target`
# so it can label PRs from forks (the workflow file from base, not
# the PR head, runs — never executes untrusted PR code).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: apply labels
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          dot: true
