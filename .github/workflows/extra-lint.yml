name: extra-lint

# Linters that aren't Go-specific. Each is a separate job so a failure
# in one doesn't mask others. All four are added to ci.yml's `required`
# rollup (cross-workflow status checks via the workflow's job names).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint.json
          globs: |
            **/*.md
            !node_modules
            !vendor
            !.git

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          config_file: .yamllint.yml
          strict: true
          format: github

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          # `github-check` posts annotations and the `error` fail-level
          # makes the job fail if actionlint reports any issue. The
          # action installs shellcheck on the runner, so actionlint
          # auto-runs it on every `run:` block.
          reporter: github-check
          fail_level: error

  editorconfig:
    name: editorconfig-checker
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
      - run: editorconfig-checker -config .editorconfig-checker.json

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@7b04f660f4ee4f048d18fd341887cf28dfbedfe2 # v1.46.3
        with:
          config: .typos.toml

  # Cross-job rollup so the master ruleset can require a single check
  # for this workflow. Add new lint jobs above and append to `needs:`.
  extra-lint-required:
    name: extra-lint required
    if: always()
    needs:
      - markdownlint
      - yamllint
      - actionlint
      - editorconfig
      - typos
    runs-on: ubuntu-latest
    steps:
      - name: Verify all extra-lint checks succeeded
        env:
          RESULT: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          if echo "$RESULT" | grep -qE '(failure|cancelled)'; then
            echo "::error::an extra-lint check failed: $RESULT"
            exit 1
          fi
          echo "all extra-lint checks passed: $RESULT"
